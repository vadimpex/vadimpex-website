<style>
/*FONTS*/

/* ---------- tokens: light is the base, dark redefines only values ---------- */
:root{
  --red:#E31F28;
  --red-act:#E31F28;
  --btn-fg:#FFFFFF;
  --ink:#22282A;
  --soft:#5F6769;
  --paper:#F7F4F2;
  --raised:#FFFFFF;
  --line:#E4DBD6;
  --band:#22282A;
  --band-ink:#F4F1EF;
  --band-soft:#B9C0C1;
  --fan:#22282A;
  --arc:#C9B8B0;
  --shadow:0 1px 2px rgba(34,40,42,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --red:#E31F28; --red-act:#FF5D63; --btn-fg:#15191A;
    --ink:#EDE9E6; --soft:#9AA1A3;
    --paper:#15191A; --raised:#1D2223; --line:#2F3537;
    --band:#0E1112; --band-ink:#F1EEEC; --band-soft:#98A0A2;
    --fan:#8A9295; --arc:#3A4143;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --red:#E31F28; --red-act:#FF5D63; --btn-fg:#15191A;
  --ink:#EDE9E6; --soft:#9AA1A3;
  --paper:#15191A; --raised:#1D2223; --line:#2F3537;
  --band:#0E1112; --band-ink:#F1EEEC; --band-soft:#98A0A2;
  --fan:#8A9295; --arc:#3A4143;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto;}}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  font-size:17px;line-height:1.62;-webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:'Archivo','Segoe UI',system-ui,sans-serif;text-wrap:balance;margin:0;}
a{color:var(--red-act);}
a:focus-visible,button:focus-visible{outline:2px solid var(--red-act);outline-offset:3px;}
.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(18px,4vw,40px);}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}

/* ---------- header ---------- */
.hdr{
  position:sticky;top:0;z-index:50;background:var(--paper);
  border-bottom:1px solid var(--line);
}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:15px;padding-bottom:15px;}
.brand{display:flex;align-items:center;flex:none;}
.brand img{height:26px;width:auto;display:block;}
.brand .dk{display:none;}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .brand .lt{display:none;}
  :root:not([data-theme="light"]) .brand .dk{display:block;}
}
:root[data-theme="dark"] .brand .lt{display:none;}
:root[data-theme="dark"] .brand .dk{display:block;}

.nav{display:flex;align-items:center;gap:22px;}
.nav a{
  font-size:.79rem;letter-spacing:.05em;text-transform:uppercase;color:var(--soft);
  text-decoration:none;white-space:nowrap;
}
.nav a:hover{color:var(--red-act);}
.tools{display:flex;align-items:center;gap:9px;flex:none;}
.lang{display:inline-flex;border:1px solid var(--line);}
.lang button{
  font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.1em;
  padding:5px 9px;border:0;background:transparent;color:var(--soft);cursor:pointer;
}
.lang button[aria-pressed="true"]{color:var(--red-act);font-weight:500;}
.iconbtn{
  border:1px solid var(--line);background:transparent;color:var(--soft);
  width:32px;height:30px;display:grid;place-items:center;cursor:pointer;padding:0;
}
.iconbtn svg{width:15px;height:15px;display:block;}
.burger{display:none;}
@media(max-width:940px){
  .nav{
    display:none;position:absolute;top:100%;left:0;right:0;background:var(--paper);
    border-bottom:1px solid var(--line);flex-direction:column;align-items:flex-start;
    gap:0;padding:6px clamp(18px,4vw,40px) 16px;
  }
  .nav.open{display:flex;}
  .nav a{padding:11px 0;width:100%;border-bottom:1px solid var(--line);font-size:.85rem;}
  .nav a:last-child{border-bottom:0;}
  .burger{display:grid;}
}

/* ---------- hero ---------- */
/* A fixed, sane height. An aspect-ratio hero grows past the fold on wide monitors
   and buries the headline; the graphic adapts to the box instead. */
.hero{
  position:relative;height:clamp(430px,62vh,620px);overflow:hidden;
  background:var(--paper);border-bottom:1px solid var(--line);
}
.heroart{position:absolute;inset:0;}
.hero svg{position:absolute;inset:0;width:100%;height:100%;}
/* The card is held inside the same 1180px column as every section below, so the
   headline starts on the same line as the body copy further down the page. */
.herocard{position:absolute;left:0;right:0;bottom:0;max-width:1180px;margin-inline:auto;}
.herocard-inner{
  width:min(52%,600px);
  padding:clamp(22px,3vw,34px) clamp(18px,4vw,40px);
  background:var(--paper);border-top:1px solid var(--line);border-right:1px solid var(--line);
}
.eyebrow{
  font-family:'IBM Plex Mono',monospace;font-size:clamp(.6rem,1.1vw,.7rem);letter-spacing:.15em;
  text-transform:uppercase;color:var(--red-act);margin:0 0 13px;
}
.herocard h1{font-weight:800;letter-spacing:-.03em;line-height:1.05;font-size:clamp(1.25rem,3vw,2.4rem);}
.herosub{color:var(--soft);margin:14px 0 0;font-size:clamp(.82rem,1.35vw,1rem);max-width:50ch;}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;}
.btn{
  display:inline-block;background:var(--red-act);color:var(--btn-fg);text-decoration:none;
  font-size:.85rem;font-weight:500;padding:12px 22px;border:1px solid var(--red-act);
}
.btn:hover{filter:brightness(1.08);}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink);}
@media(max-width:860px){
  .hero{height:auto;display:flex;flex-direction:column;}
  .hero .heroart{position:relative;inset:auto;aspect-ratio:900/420;}
  .herocard{position:static;max-width:none;}
  .herocard-inner{width:auto;border-right:0;}
}

/* ---------- generic sections ---------- */
section{border-bottom:1px solid var(--line);}
/* the header is sticky, so anchor jumps must stop short of it */
section[id]{scroll-margin-top:74px;}
.pad{padding:clamp(38px,5vw,58px) 0;}
.h2{font-size:clamp(1.25rem,2.6vw,1.75rem);font-weight:800;letter-spacing:-.02em;margin-bottom:12px;}
.lead{color:var(--soft);max-width:64ch;margin:0;}

/* full-bleed grids are capped to the same column as .wrap, so every section
   lines up on a wide monitor instead of some running edge to edge */
.cards,.split,.contact{max-width:1180px;margin-inline:auto;}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));}
.cards article{padding:clamp(26px,3vw,34px) clamp(18px,4vw,40px);border-left:1px solid var(--line);}
.cards article:first-child{border-left:0;}
@media(max-width:800px){.cards article{border-left:0;border-top:1px solid var(--line);}.cards article:first-child{border-top:0;}}
.cards h3{font-size:1.04rem;font-weight:700;margin-bottom:10px;letter-spacing:-.01em;}
.cards h3::before{content:"";display:block;width:22px;height:2px;background:var(--red);margin-bottom:14px;}
.cards p{margin:0;font-size:.91rem;color:var(--soft);}

.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));}
.split > div{padding:clamp(28px,3vw,36px) clamp(18px,4vw,40px);border-left:1px solid var(--line);}
.split > div:first-child{border-left:0;}
@media(max-width:800px){.split > div{border-left:0;border-top:1px solid var(--line);}.split > div:first-child{border-top:0;}}
.split h3{font-size:1.08rem;font-weight:800;margin-bottom:11px;letter-spacing:-.015em;}
.split p{margin:0 0 11px;font-size:.93rem;color:var(--soft);}
.split p:last-of-type{margin-bottom:0;}
.stockrow{background:var(--raised);}
.stockrow .url{font-family:'IBM Plex Mono',monospace;font-size:.74rem;letter-spacing:.05em;color:var(--red-act);margin:0 0 18px;}

/* ---------- memberships ---------- */
.creds{
  list-style:none;margin:26px 0 0;padding:0;display:grid;
  grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);
}
@media(min-width:960px){.creds{grid-template-columns:repeat(5,1fr);}}
.cred{background:var(--paper);padding:22px 18px 19px;position:relative;display:flex;flex-direction:column;}
.cred::before{content:"";position:absolute;top:0;left:0;height:2px;width:26px;background:var(--red);transition:width .24s ease;}
.cred:hover::before,.cred:focus-within::before{width:100%;}
.cred .glyph{position:absolute;top:15px;right:14px;width:25px;height:25px;opacity:.55;}
.cred h3{font-size:.97rem;font-weight:800;margin:14px 0 7px;letter-spacing:-.01em;padding-right:28px;}
.cred p{margin:0 0 15px;font-size:.81rem;color:var(--soft);line-height:1.5;flex:1;}
.cred .rec{font-family:'IBM Plex Mono',monospace;font-size:.66rem;letter-spacing:.05em;color:var(--soft);border-top:1px solid var(--line);padding-top:12px;}
.cred .rec b{display:block;color:var(--ink);font-weight:500;margin-top:3px;word-break:break-word;}
.cred a{margin-top:12px;font-size:.78rem;font-weight:500;text-decoration:none;}
.cred a:hover{text-decoration:underline;}
.cred.filler{padding:0;}
.cred.filler::before{display:none;}

/* ---------- team ---------- */
.teamsec{background:var(--raised);}
.roster{list-style:none;margin:26px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(224px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);}
.roster li{background:var(--raised);padding:19px 19px 17px;}
.roster .nm{font-family:'Archivo',sans-serif;font-weight:700;font-size:.97rem;letter-spacing:-.01em;margin:0;}
.roster .rl{font-family:'IBM Plex Mono',monospace;font-size:.64rem;letter-spacing:.11em;text-transform:uppercase;color:var(--red-act);margin:6px 0 12px;}
.roster .ct{margin:0;font-size:.8rem;line-height:1.7;color:var(--soft);word-break:break-word;}
.roster .ct a{color:var(--soft);text-decoration:none;}
.roster .ct a:hover{color:var(--red-act);}
.roster li.office{background:var(--paper);}
.roster li.office .ct a{color:var(--red-act);}
.roster li.art{background:var(--paper);position:relative;overflow:hidden;min-height:122px;padding:0;}
.roster li.art svg{position:absolute;inset:0;width:100%;height:100%;}

/* ---------- band ---------- */
.band{background:var(--band);color:var(--band-ink);}
.band .wrap{display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:space-between;padding-top:clamp(28px,4vw,40px);padding-bottom:clamp(28px,4vw,40px);}
.band h3{font-size:1.18rem;font-weight:800;letter-spacing:-.015em;margin-bottom:8px;}
.band p{margin:0;color:var(--band-soft);font-size:.93rem;max-width:54ch;}
.band .btn{background:var(--red);border-color:var(--red);color:#fff;}

/* ---------- contact ---------- */
.contact{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));}
.contact > div{padding:clamp(26px,3vw,34px) clamp(18px,4vw,40px);border-left:1px solid var(--line);}
.contact > div:first-child{border-left:0;}
@media(max-width:800px){.contact > div{border-left:0;border-top:1px solid var(--line);}.contact > div:first-child{border-top:0;}}
.contact h4{font-family:'IBM Plex Mono',monospace;font-size:.67rem;letter-spacing:.15em;text-transform:uppercase;color:var(--soft);margin-bottom:13px;font-weight:500;}
.contact p{margin:0;font-size:.92rem;line-height:1.72;}
.contact a{text-decoration:none;}
.contact .reg{font-family:'IBM Plex Mono',monospace;font-size:.79rem;color:var(--soft);}

/* ---------- legal pages ---------- */
.legal{padding:clamp(38px,5vw,60px) 0 clamp(20px,3vw,30px);}
.legal h1{font-weight:800;font-size:clamp(1.6rem,3.4vw,2.3rem);letter-spacing:-.03em;margin-bottom:14px;}
.legal .basis{margin:0 0 32px;font-size:.88rem;color:var(--soft);max-width:78ch;}
.rows{display:grid;border-top:1px solid var(--line);}
.rows > div{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;padding:15px 0;border-bottom:1px solid var(--line);}
@media(min-width:760px){.rows > div{grid-template-columns:290px minmax(0,1fr);gap:28px;align-items:baseline;}}
.rows dt{font-family:'IBM Plex Mono',monospace;font-size:.69rem;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin:0;}
.rows dd{margin:0;font-size:.92rem;}
.rows dd a{text-decoration:none;}
.legal .after{margin-top:36px;padding-top:28px;border-top:2px solid var(--ink);}
.legal .after h2{font-size:1.06rem;font-weight:800;letter-spacing:-.015em;margin-bottom:9px;}
.legal .after p{margin:0 0 22px;font-size:.89rem;color:var(--soft);max-width:78ch;}

/* ---------- footer ---------- */
.ftr{border-top:1px solid var(--line);}
.ftr .wrap{
  display:flex;flex-wrap:wrap;gap:14px 26px;align-items:center;justify-content:space-between;
  padding-top:22px;padding-bottom:26px;
  font-family:'IBM Plex Mono',monospace;font-size:.67rem;letter-spacing:.09em;
  text-transform:uppercase;color:var(--soft);
}
.ftr a{color:var(--soft);text-decoration:none;}
.ftr a:hover{color:var(--red-act);}
.ftr nav{display:flex;flex-wrap:wrap;gap:18px;}

[hidden]{display:none !important;}
/* Visible is the resting state and the animation only fades IN from it. If the
   animation never runs -- reduced motion, a background tab, an old browser --
   the content is simply there. The previous version defaulted to opacity 0 and
   could leave the map labels permanently invisible. */
.ray{opacity:1;animation:fade .7s ease-out backwards;}
@keyframes fade{from{opacity:0;}}
@media(prefers-reduced-motion:reduce){.ray{animation:none;}}
</style>

  function el(id) { return document.getElementById(id); }

  function glyph() {
    var out = "", n = 9;
    for (var i = 0; i < n; i++) {
      var a = (-160 + (120 * i) / (n - 1)) * Math.PI / 180;
      out += '<line x1="' + (20 + Math.cos(a) * 22).toFixed(1) + '" y1="' + (34 + Math.sin(a) * 22).toFixed(1) +
             '" x2="20" y2="34" stroke="currentColor" stroke-width="1" opacity="' + (i % 3 === 0 ? ".95" : ".4") + '"/>';
    }
    return '<g style="color:var(--red)">' + out + '</g>';
  }

  function fanArt() {
    var cx = 210, cy = 138, out = "";
    for (var i = 0; i < 46; i++) {
      var a = (-172 + 164 * (i / 45)) * Math.PI / 180, acc = i % 6 === 0;
      out += '<line x1="' + (cx + Math.cos(a) * 300).toFixed(1) + '" y1="' + (cy + Math.sin(a) * 300).toFixed(1) +
             '" x2="' + cx + '" y2="' + cy + '" stroke="' + (acc ? "var(--red)" : "var(--fan)") +
             '" stroke-width="' + (acc ? .9 : .5) + '" opacity="' + (acc ? .3 : .14) + '"/>';
    }
    return '<svg viewBox="0 0 420 150" preserveAspectRatio="xMidYMax slice" aria-hidden="true">' + out +
           '<circle cx="' + cx + '" cy="' + cy + '" r="3.2" fill="var(--red)"/></svg>';
  }

  function padGrid(ul, count, cls, inner) {
    [].forEach.call(ul.querySelectorAll(".filler,.art"), function (f) { ul.removeChild(f); });
    var cols = getComputedStyle(ul).gridTemplateColumns.split(" ").filter(Boolean).length;
    var missing = (cols - (count % cols)) % cols;
    if (!missing) return;
    if (cls === "art") {
      var a = document.createElement("li");
      a.className = "art"; a.style.gridColumn = "span " + missing;
      a.setAttribute("aria-hidden", "true"); a.innerHTML = inner;
      ul.appendChild(a);
    } else {
      for (var i = 0; i < missing; i++) {
        var f = document.createElement("li");
        f.className = "cred filler"; f.setAttribute("aria-hidden", "true");
        ul.appendChild(f);
      }
    }
  }

  function renderRows(id, key) {
    el(id).innerHTML = t(key).map(function (r) {
      return "<div><dt>" + r[0] + "</dt><dd>" + r[1] + "</dd></div>";
    }).join("");
  }

  var routeRetries = 0;
  function renderRoutes() {
    var svg = el("routes");
    var art = document.querySelector(".heroart").getBoundingClientRect();
    // On first paint the box can still measure zero. Waiting a frame and trying
    // again is the difference between the map drawing and the hero staying blank
    // until the visitor happens to resize the window.
    if (!art.width || !art.height) {
      if (routeRetries++ < 60) requestAnimationFrame(renderRoutes);
      return;
    }
    routeRetries = 0;

    // The viewBox tracks the box's real proportions, so the composition holds on a
    // tall phone and on a wide monitor without stretching or cropping.
    var W = 900, H = Math.round(W * art.height / art.width);
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.innerHTML = "";

    var cs = getComputedStyle(document.documentElement);
    var FAN = cs.getPropertyValue("--fan").trim() || "#22282A";
    var ARC = cs.getPropertyValue("--arc").trim() || "#C9B8B0";
    var RED = cs.getPropertyValue("--red").trim() || "#E31F28";
    var SOFT = cs.getPropertyValue("--soft").trim() || "#5F6769";
    var INK = cs.getPropertyValue("--ink").trim() || "#22282A";
    var NS = "http://www.w3.org/2000/svg";
    function mk(n, a) { var e = document.createElementNS(NS, n); for (var k in a) e.setAttribute(k, a[k]); return e; }

    var cx = W * BADEN.x, cy = H * BADEN.y;
    var reach = Math.max(W, H) * 1.9;

    // Label size is decided in real screen pixels and then converted into viewBox
    // units. Sizing it in viewBox units alone makes the names grow with the
    // container -- on a wide monitor they ended up as large as the wordmark, and
    // on a phone they shrank to about 5px.
    var pxPerUnit = art.width / W;
    var targetPx = Math.max(10, Math.min(13, art.width / 130));
    var type = targetPx / pxPerUnit;
    var dotR = Math.max(1.6, type * 0.26);

    [0.13, 0.24, 0.36, 0.50, 0.65].forEach(function (f, i) {
      var c = mk("circle", { cx: cx, cy: cy, r: W * f, fill: "none", stroke: ARC,
                             "stroke-width": ".9", opacity: ".5", "class": "ray" });
      c.style.animationDelay = (i * 80) + "ms"; svg.appendChild(c);
    });

    for (var i = 0; i < 80; i++) {
      var ang = (-179 + 174 * (i / 79)) * Math.PI / 180, acc = i % 10 === 0;
      var l = mk("line", { x1: cx + Math.cos(ang) * reach, y1: cy + Math.sin(ang) * reach, x2: cx, y2: cy,
                           stroke: acc ? RED : FAN, "stroke-width": acc ? .8 : .5,
                           opacity: acc ? .26 : .1, "class": "ray" });
      l.style.animationDelay = (i * 6) + "ms"; svg.appendChild(l);
    }

    // keep every label clear of the copy panel that overlaps the lower left
    var card = document.querySelector(".herocard-inner");
    var cardRight = W, cardTop = H;
    if (getComputedStyle(document.querySelector(".herocard")).position === "absolute") {
      var cb = card.getBoundingClientRect();
      cardRight = (cb.right - art.left) * (W / art.width);
      cardTop = (cb.top - art.top) * (H / art.height) - type * 2.2;
    }

    // Every route keeps its line and dot; only the names are dropped when there is
    // genuinely no room for them, which is what happens on a phone.
    var placed = [];
    DESTS.forEach(function (d, i) {
      var x = W * d.x, y = H * d.y;
      if (x < cardRight && y > cardTop) y = Math.max(type * 2.2, cardTop);
      var ln = mk("line", { x1: x, y1: y, x2: cx, y2: cy, stroke: RED,
                            "stroke-width": 1.1, opacity: .8, "class": "ray" });
      ln.style.animationDelay = (420 + i * 50) + "ms"; svg.appendChild(ln);
      // The dots and the country names are deliberately NOT animated. On the
      // machine where this first went wrong, the only label that appeared was the
      // one without an animation, so nothing that carries meaning depends on one.
      svg.appendChild(mk("circle", { cx: x, cy: y, r: dotR, fill: RED }));

      var half = d.n.length * type * 0.74 / 2;   // mono advance plus letter-spacing
      var ty = y - type * 1.15;
      var box = { x0: x - half, x1: x + half, y: ty };
      var clash = placed.some(function (p) {
        return box.x1 + type * 0.6 > p.x0 && p.x1 + type * 0.6 > box.x0 &&
               Math.abs(box.y - p.y) < type * 1.8;
      });
      if (clash) return;
      placed.push(box);
      var tx = mk("text", { x: x, y: ty, "text-anchor": "middle",
                            "font-family": "IBM Plex Mono, monospace", "font-size": type,
                            "letter-spacing": type * 0.14, fill: SOFT });
      tx.textContent = d.n; svg.appendChild(tx);
    });

    svg.appendChild(mk("circle", { cx: cx, cy: cy, r: type * 1.3, fill: "none", stroke: RED, "stroke-width": "1.2", opacity: ".55" }));
    svg.appendChild(mk("circle", { cx: cx, cy: cy, r: type * 0.5, fill: RED }));

    // Baden normally sits to the right of its node; on a narrow screen there is no
    // room there, so the label flips to the left rather than running off the edge.
    var badenText = "BADEN, AT";
    var badenW = badenText.length * type * 1.12 * 0.74;
    var toLeft = cx + type * 2 + badenW > W - type;
    var lbl = mk("text", {
      x: toLeft ? cx - type * 1.8 : cx + type * 2,
      y: cy + type * 0.45,
      "text-anchor": toLeft ? "end" : "start",
      "font-family": "IBM Plex Mono, monospace",
      "font-size": type * 1.12, "letter-spacing": type * 0.2, fill: INK
    });
    lbl.textContent = badenText; svg.appendChild(lbl);

    svg.setAttribute("aria-label", lang === "de"
      ? "Handelsrouten aus unseren Hauptmärkten, die in Baden zusammenlaufen"
      : "Trade routes from our main markets converging on Baden, Austria");
  }

  function applyLang() {
    document.documentElement.lang = lang;
    [].forEach.call(document.querySelectorAll("[data-t]"), function (e) {
      e.innerHTML = t(e.getAttribute("data-t"));
    });
    renderCards(); renderCreds(); renderTeam();
    renderRows("imp-rows", "imp.rows");
    renderRows("pri-rows", "pri.rows");
    el("l-en").setAttribute("aria-pressed", String(lang === "en"));
    el("l-de").setAttribute("aria-pressed", String(lang === "de"));
    renderRoutes();
  }

  /* ---------- theme ---------- */
  var SUN = '<circle cx="12" cy="12" r="4.5"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"></path>';
  var MOON = '<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"></path>';
  function isDark() {
    var s = document.documentElement.getAttribute("data-theme");
    if (s) return s === "dark";
    return window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  function paintThemeIcon() { el("theme").querySelector("svg").innerHTML = isDark() ? MOON : SUN; }
  el("theme").addEventListener("click", function () {
    document.documentElement.setAttribute("data-theme", isDark() ? "light" : "dark");
    paintThemeIcon(); renderRoutes();
  });

  /* ---------- routing ---------- */
  function route() {
    var h = location.hash;
    var page = h === "#/imprint" ? "imprint" : h === "#/privacy" ? "privacy" : "home";
    ["home", "imprint", "privacy"].forEach(function (p) {
      el("page-" + p).hidden = p !== page;
    });
    if (page !== "home") window.scrollTo(0, 0);
    else if (h && h.length > 1 && h !== "#/") {
      var target = document.querySelector(h);
      if (target) target.scrollIntoView();
    }
    el("nav").classList.remove("open");
    el("burger").setAttribute("aria-expanded", "false");
  }
  window.addEventListener("hashchange", route);

  el("burger").addEventListener("click", function () {
    var open = el("nav").classList.toggle("open");
    this.setAttribute("aria-expanded", String(open));
  });
  el("l-en").addEventListener("click", function () { lang = "en"; applyLang(); });
  el("l-de").addEventListener("click", function () { lang = "de"; applyLang(); });

  var rt;
  window.addEventListener("resize", function () {
    clearTimeout(rt);
    rt = setTimeout(function () { renderCreds(); renderTeam(); renderRoutes(); }, 150);
  });

  el("yr").textContent = new Date().getFullYear();
  paintThemeIcon();
  applyLang();
  route();
  // Fonts change text metrics and a late layout changes the hero's box. The
  // visibility hook matters for a link opened in a background tab: there the
  // browser freezes requestAnimationFrame and can report a zero-sized box, so the
  // map is drawn when the tab is actually looked at.
  window.addEventListener("load", renderRoutes);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) renderRoutes();
  });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(renderRoutes);
})();
</script>
